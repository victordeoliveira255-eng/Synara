services:
  - type: web
    name: synara-web
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    branch: main
    autoDeploy: true
    envVars:
      # Ambiente de producao reconhecido explicitamente pela aplicacao
      # (cookie Secure, Helmet HTTPS, reset de senha sem expor token, rate limits).
      - key: NODE_ENV
        value: production
      # Segredos: definidos SOMENTE no painel do Render (Environment),
      # nunca com valores reais neste arquivo.
      - key: JWT_SECRET
        sync: false
      # Database: o Postgres gratuito do Render foi descontinuado. Aponte para
      # um Postgres gerenciado (ex.: Supabase). Use a connection string no modo
      # "Session pooler" do Supabase (porta 5432). O SSL e ativado automaticamente.
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Gemini: provedor PRINCIPAL de geracao de texto. A CHAVE e um segredo
      # definido SOMENTE no painel do Render (sync: false). O modelo e a
      # preferencia de provedor sao configuracao nao sensivel.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: AI_TEXT_PROVIDER
        value: auto
      - key: ALLOWED_ORIGINS
        sync: false