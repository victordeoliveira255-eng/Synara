<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha | SYNARA</title>
  <!-- Tema: roda antes do CSS para a página não piscar no tema errado.
       A CSP atual (script-src 'self' 'unsafe-inline') já permite este bloco. -->
  <script>
    (function () {
      var KEY = 'synara-theme';
      var root = document.documentElement;
      function read() {
        try { return window.localStorage.getItem(KEY) === 'dark' ? 'dark' : 'light'; }
        catch (e) { return 'light'; }
      }
      function paint(theme) {
        root.setAttribute('data-theme', theme);
        var dark = theme === 'dark';
        var label = dark ? 'Ativar tema claro' : 'Ativar tema escuro';
        var buttons = document.querySelectorAll('[data-theme-toggle]');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].setAttribute('aria-pressed', dark ? 'true' : 'false');
          buttons[i].setAttribute('aria-label', label);
          buttons[i].setAttribute('title', label);
        }
      }
      function save(theme) {
        try { window.localStorage.setItem(KEY, theme); } catch (e) {}
      }
      paint(read());
      function sync() { paint(root.getAttribute('data-theme') || 'light'); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
      else sync();
      document.addEventListener('click', function (event) {
        var target = event.target;
        var button = target && target.closest ? target.closest('[data-theme-toggle]') : null;
        if (!button) return;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        paint(next);
        save(next);
      });
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-icon" src="assets/icon.png" alt="SYNARA Icon">
      <span class="brand-text"><strong>SYNARA</strong><small>Bem-estar & Educação</small></span>
    </a>
    <button class="sy-theme-toggle" type="button" data-theme-toggle aria-label="Ativar tema escuro" aria-pressed="false" title="Ativar tema escuro">
      <svg class="sy-theme-toggle__icon is-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="sy-theme-toggle__icon is-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
    </button>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="login.html">Entrar</a>
    </nav>
  </header>

  <main class="page-content auth-page">
    <section class="section auth-section">
      <div class="section-header auth-header">
        <span class="eyebrow">Recuperação de acesso</span>
        <h1>Defina uma nova senha</h1>
        <p>Escolha uma senha com pelo menos 6 caracteres.</p>
      </div>
      <div class="auth-layout">
        <div class="auth-card">
          <form class="auth-form" id="resetPasswordForm">
            <div class="form-field">
              <label for="newPassword">Nova senha</label>
              <input id="newPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password" required />
            </div>
            <div class="form-field">
              <label for="confirmPassword">Confirme a nova senha</label>
              <input id="confirmPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password" required />
            </div>
            <button type="submit" class="button-primary">Redefinir senha</button>
            <p class="form-error" id="resetError" role="alert"></p>
            <p class="form-success" id="resetSuccess" role="status"></p>
          </form>
          <p class="auth-back"><a href="login.html">← Voltar para o login</a></p>
        </div>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    const resetForm = document.getElementById('resetPasswordForm');
    const resetError = document.getElementById('resetError');
    const resetSuccess = document.getElementById('resetSuccess');
    const token = new URLSearchParams(window.location.search).get('token');

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetError.textContent = '';
      resetSuccess.textContent = '';
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (!token) {
        resetError.textContent = 'Link de recuperação inválido ou expirado.';
        return;
      }
      if (password !== confirmation) {
        resetError.textContent = 'As senhas precisam ser iguais.';
        return;
      }

      const result = await auth.resetPassword(token, password);
      if (result.success) {
        resetForm.reset();
        resetSuccess.textContent = `${result.message} Você já pode entrar novamente.`;
      } else {
        resetError.textContent = result.message;
      }
    });
  </script>
</body>
</html>
