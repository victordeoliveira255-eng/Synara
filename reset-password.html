<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha | SYNARA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-icon" src="assets/icon.svg" alt="SYNARA Icon">
      <span class="brand-text"><strong>SYNARA</strong><small>Bem-estar & Aprendizado</small></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="login.html">Entrar</a>
    </nav>
  </header>

  <main class="page-content auth-page">
    <section class="section auth-section">
      <div class="section-header auth-header">
        <span class="eyebrow">Recuperação de acesso</span>
        <h2>Defina uma nova senha</h2>
        <p>Escolha uma senha com pelo menos 6 caracteres.</p>
      </div>
      <div class="auth-layout">
        <div class="auth-card">
          <form class="auth-form" id="resetPasswordForm">
            <div class="form-field">
              <label for="newPassword">Nova senha</label>
              <input id="newPassword" type="password" minlength="6" maxlength="128" required />
            </div>
            <div class="form-field">
              <label for="confirmPassword">Confirme a nova senha</label>
              <input id="confirmPassword" type="password" minlength="6" maxlength="128" required />
            </div>
            <button type="submit" class="button-primary">Redefinir senha</button>
            <p class="form-error" id="resetError"></p>
            <p class="form-success" id="resetSuccess"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    const resetForm = document.getElementById('resetPasswordForm');
    const resetError = document.getElementById('resetError');
    const resetSuccess = document.getElementById('resetSuccess');
    const token = new URLSearchParams(window.location.search).get('token');

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetError.textContent = '';
      resetSuccess.textContent = '';
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (!token) {
        resetError.textContent = 'Link de recuperação inválido ou expirado.';
        return;
      }
      if (password !== confirmation) {
        resetError.textContent = 'As senhas precisam ser iguais.';
        return;
      }

      const result = await auth.resetPassword(token, password);
      if (result.success) {
        resetForm.reset();
        resetSuccess.textContent = `${result.message} Você já pode entrar novamente.`;
      } else {
        resetError.textContent = result.message;
      }
    });
  </script>
</body>
</html>
